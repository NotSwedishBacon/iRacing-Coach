[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iracing-engineer-mcp"
version = "0.1.0"
description = "iRacing Setup RAG & Telemetry Engineering MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.6.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
iracing-engineer-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "telemetry", "rag", "mcp_server"]
py-modules = ["config"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
